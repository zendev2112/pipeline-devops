apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: monitoring }
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, type: prometheus, url: http://prometheus:9090, isDefault: true }
  dashboards.yml: |
    apiVersion: 1
    providers:
      - { name: default, type: file, options: { path: /var/lib/grafana/dashboards } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: app-dashboard }   # generado por kustomize desde app.json
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  selector: { app: grafana }
  ports: [{ port: 80, targetPort: 3000 }]
