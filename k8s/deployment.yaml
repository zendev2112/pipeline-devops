apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: pipeline-devops
  labels: { app: pipeline-devops-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pipeline-devops-app }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: pipeline-devops-app }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: ghcr.io/zendev2112/pipeline-devops-app:latest   # el pipeline reemplaza el tag
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - { name: APP_VERSION, valueFrom: { configMapKeyRef: { name: app-config, key: APP_VERSION } } }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready,  port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
